<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Tanisha Yadav" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#0ea5c6"/>
      <stop offset="35%" stop-color="#3b5bdb"/>
      <stop offset="70%" stop-color="#8e1fa8"/>
      <stop offset="100%" stop-color="#d6246e"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;-500 0;0 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="280" rx="8"/></clipPath>
    <clipPath id="typing">
      <rect x="80" y="128" width="840" height="46">
        <animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.5;0.9;1" values="0;0;840;840;0"/>
      </rect>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="url(#bg)"/>

    <path d="M0 235 Q250 205 500 235 T1000 235 T1500 235 T2000 235 L2000 280 L0 280 Z" fill="#000" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M0 248 Q250 270 500 248 T1000 248 T1500 248 T2000 248 L2000 280 L0 280 Z" fill="#fff" opacity="0.12">
      <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="12s" repeatCount="indefinite"/>
    </path>

    <circle cx="120" cy="260" r="4" fill="#fff" opacity="0.5"><animate attributeName="cy" values="270;10" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="260" r="3" fill="#fff" opacity="0.5"><animate attributeName="cy" values="270;10" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="260" r="5" fill="#fff" opacity="0.5"><animate attributeName="cy" values="270;10" dur="7s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="7s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="260" r="3" fill="#fff" opacity="0.5"><animate attributeName="cy" values="270;10" dur="9s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="9s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="260" r="4" fill="#fff" opacity="0.5"><animate attributeName="cy" values="270;10" dur="6.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="6.5s" begin="3s" repeatCount="indefinite"/></circle>

    <g>
      <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.3;0.7;1" keySplines="0.2 0.6 0.3 1;0 0 1 1;0.4 0 0.8 1" values="-300 0;0 0;0 0;60 0"/>
      <text x="500" y="105" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#ffffff">Tanisha Yadav
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.3;0.7;1" values="0;1;1;0"/>
      </text>
    </g>

    <text x="80" y="158" textLength="840" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing)" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#ffffff">Powered by curiosity, compiled by caffeine, debugged by reality.</text>
    <rect y="136" width="3" height="28" fill="#ffffff">
      <animate attributeName="x" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.5;0.9;1" values="80;80;920;920;80"/>
      <animate attributeName="opacity" dur="0.8s" repeatCount="indefinite" values="1;0;1" keyTimes="0;0.5;1"/>
    </rect>

    <text x="500" y="208" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff">B.Tech CSE  |  Java &amp; Python  |  Aspiring ML Engineer
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;1" dur="3s" fill="freeze"/>
    </text>
  </g>
</svg>
